<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📔 Marcaciones</title>
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 20px; }
    .card { max-width: 1000px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; margin-bottom: 5px; }
    
    #reloj {
        text-align: center; font-size: 18px; color: #1565c0; font-weight: bold;
        margin-bottom: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
    input, select { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 15px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; }
    button:hover { opacity: 0.8; }
    .in { background: #4CAF50; color: #fff; }
    .out { background: #f44336; color: #fff; }
    .xls { background: #1976d2; color: #fff; width: 100%; margin-bottom: 5px; }
    .clear { background: #757575; color: #fff; width: 100%; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #f0f0f0; }
    
    .status-msg { font-size: 12px; color: green; margin-top: 5px; display: none; }
    .pendiente { color: #d32f2f; font-style: italic; font-weight: bold; }
    .completado { color: #388e3c; font-weight: bold; }

    .contador-container {
      margin-left: auto; background: #333; color: #fff; padding: 8px 15px;
      border-radius: 5px; font-weight: bold; font-size: 14px; min-width: 120px; text-align: center;
    }
    #num-contador { font-size: 18px; color: #ffeb3b; margin-left: 5px; }
    
    /* Indicador de conexión */
    #db-status { text-align: center; font-size: 12px; margin-bottom: 10px; color: #666; }
    .online { color: green; font-weight: bold; }
    .offline { color: red; font-weight: bold; }

    /* MODIFICADO: Estilo compacto para que haga juego con los demás botones del panel */
    input[type="file"] {
        flex: none; /* Evita que se estire ocupando todo el ancho (espaciado excesivo) */
        width: auto;
        padding: 0; /* Elimina el relleno gordo que heredaba del buscador de cédula */
        font-size: 13px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        color: #555;
        cursor: pointer;
        overflow: hidden;
    }
    input[type="file"]::file-selector-button {
        background: #607d8b; /* Color que hace juego con "Descargar Respaldo" */
        color: white;
        border: none;
        border-right: 1px solid #ccc;
        padding: 8px 12px; /* Mismo tamaño de los botones naranjas y grises */
        cursor: pointer;
        font-size: 13px;
        margin-right: 10px;
        transition: 0.3s;
    }
    input[type="file"]::file-selector-button:hover {
        opacity: 0.8;
    }
  </style>
</head>
<body>

  <audio id="snd-notif" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

  <div class="card">
    <h1>📔 Control de asistencias</h1>
    <div id="db-status">Iniciando sistema...</div>
    
    <div id="reloj">--:--:--</div>

    <!-- Panel de Control oculto -->
    <button onclick="togglePanel()" style="background: #e0e0e0; color: #333; border: 1px solid #ccc; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-bottom: 10px; font-weight: bold;">⚙️ Panel de Control</button>

    <div id="panel-oculto" style="display: none; background: #f9f9f9; padding: 15px; border: 1px dashed #ccc; border-radius: 5px; margin-bottom: 15px;">
        <p style="font-size: 14px; color: #555; margin-top: 0;">Suba la base de empleados (Solo es necesario hacerlo una vez o al actualizar personal).</p>
        
        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
          <input type="file" id="archivoExcel" accept=".xlsx,.xls" />
          <button style="background: #607d8b; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;" onclick="descargarEmpleados()">📥 Descargar Respaldo Empleados</button>
          
          <!-- Nuevo botón añadido para Alta Rápida manual -->
          <button style="background: #ff9800; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;" onclick="altaRapida()">➕ Agregar Empleado Manualmente</button>
        </div>
        
        <div id="msgCargado" class="status-msg">✓ Lista de empleados disponible</div>
    </div>

    <div class="row" style="margin-top: 15px;">
      <input type="text" id="cedula" placeholder="Ingrese número de cédula" autofocus />
      <input type="text" id="nombre" placeholder="Nombre del empleado" readonly />
      <select id="procedencia">
        <option value="" disabled selected>Seleccione Maquila (Solo Ingreso)</option>
        <option value="Dprisa">Dprisa</option>
        <option value="H&T">H&T</option>
 	<option value="Seripro">Seripro</option>
	<option value="Otros">Otros</option>
      </select>
    </div>

    <div class="row">
      <button class="in" onclick="registrar('Ingreso')">Registrar Ingreso</button>
      <button class="out" onclick="registrar('Salida')">Registrar Salida</button>
      
      <div class="contador-container">
        <div>Ingresados hoy: <span id="num-contador">0</span></div>
        <div id="resumen-maquila" style="font-size: 11px; font-weight: normal; color: #e0e0e0; margin-top: 4px; display: none;"></div>
      </div>
    </div>

    <div class="row" style="margin-bottom: 5px;">
      <button class="xls" style="flex: 1; width: auto; margin-bottom: 0;" onclick="descargarExcel('hoy')">Descargar reporte de HOY</button>
      <button class="xls" style="flex: 1; width: auto; margin-bottom: 0; background-color: #0d47a1;" onclick="descargarExcel('pasadas')">Descargar historial PASADAS</button>
    </div>
    
    <button class="clear" onclick="limpiarRegistros()">Limpiar Todo</button>

    <div style="overflow-x: auto;">
      <table id="tabla">
        <thead>
          <tr>
            <th>Cédula</th>
            <th>Nombre</th>
            <th>Maquila</th>
            <th>Fecha</th>
            <th>Ingreso</th>
            <th>Salida</th>
            <th>Tiempo Laborado</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    // --- 1. TU CONFIGURACIÓN DE FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyA3pJXgmnpeTOH4OG9EV_oPMg-Ga5tnRdc",
      authDomain: "controlmaquila.firebaseapp.com",
      databaseURL: "https://controlmaquila-default-rtdb.firebaseio.com",
      projectId: "controlmaquila",
      storageBucket: "controlmaquila.firebasestorage.app",
      messagingSenderId: "201607113758",
      appId: "1:201607113758:web:d286dcbcb04a0bcee6520f"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    const refEmpleados = db.ref('empleados');
    const refRegistros = db.ref('registros');

    let empleadosLocal = {};
    let registrosLocal = [];
    const sound = document.getElementById('snd-notif');

    // --- 2. MONITOREO DE CONEXIÓN Y DATOS ---
    
    // Estado de conexión
    db.ref('.info/connected').on('value', function(snap) {
      const statusEl = document.getElementById('db-status');
      if (snap.val() === true) {
        statusEl.innerHTML = 'Estado: <span class="online">● Conectado a la Nube</span>';
      } else {
        statusEl.innerHTML = 'Estado: <span class="offline">○ Desconectado (Revisar internet)</span>';
      }
    });

    // Escuchar cambios en Empleados (Carga automática)
    refEmpleados.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            empleadosLocal = data;
            const msgEl = document.getElementById('msgCargado');
            if(msgEl) {
                msgEl.style.display = 'block';
                msgEl.innerText = "✓ Lista de empleados sincronizada (" + Object.keys(data).length + ") personas";
            }
        } else {
            empleadosLocal = {};
        }
    });

    // Escuchar cambios en Registros (Actualización en tiempo real)
    refRegistros.on('value', (snapshot) => {
        const data = snapshot.val();
        registrosLocal = [];
        
        if (data) {
            // Convertir objeto de Firebase a Array
            Object.keys(data).forEach(key => {
                registrosLocal.push({
                    idFirebase: key,
                    ...data[key]
                });
            });
        }
        renderizarTabla();
        actualizarContador();
    });

    // --- 3. RELOJ ---
    function actualizarReloj() {
        const ahora = new Date();
        const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
        let fechaTexto = ahora.toLocaleDateString('es-ES', opciones);
        fechaTexto = fechaTexto.charAt(0).toUpperCase() + fechaTexto.slice(1);
        document.getElementById('reloj').innerText = fechaTexto;
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    // --- 4. SUBIDA Y DESCARGA DE EXCEL (EMPLEADOS) ---
    
    function togglePanel() {
        const panel = document.getElementById('panel-oculto');
        if (panel.style.display === 'none') {
            panel.style.display = 'block';
        } else {
            panel.style.display = 'none';
        }
    }

    document.getElementById('archivoExcel').addEventListener('change', function(e) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
        
        let nuevosEmpleados = {};
        json.forEach(row => {
            if(row.Cedula) nuevosEmpleados[row.Cedula.toString().trim()] = row.Nombre;
        });

        // Guardar en la nube
        refEmpleados.set(nuevosEmpleados)
            .then(() => alert('Base de empleados actualizada en la nube correctamente.'))
            .catch(err => alert('Error al subir: ' + err.message));
      };
      reader.readAsArrayBuffer(e.target.files[0]);
    });

    function descargarEmpleados() {
        if (Object.keys(empleadosLocal).length === 0) {
            alert('No hay empleados registrados en la base actual para descargar.');
            return;
        }

        const clave = prompt('Ingrese la clave de seguridad para descargar el respaldo:');
        
        if (clave === 'Oriflame2026') {
            const datosEmpleados = Object.keys(empleadosLocal).map(cedula => ({
                Cedula: cedula,
                Nombre: empleadosLocal[cedula]
            }));

            const ws = XLSX.utils.json_to_sheet(datosEmpleados);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Base Empleados");
            XLSX.writeFile(wb, 'respaldo_base_empleados.xlsx');
        } else {
            if (clave !== null) {
                alert('Clave incorrecta. Operación cancelada.');
            }
        }
    }

    // Función añadida para dar de alta a un empleado manualmente en emergencias
    function altaRapida() {
        const nuevaCedula = prompt("Ingrese el número de cédula del nuevo empleado:");
        
        if (!nuevaCedula || nuevaCedula.trim() === "") {
            return; // Si cancela o deja vacío, no hace nada
        }
        
        const cedulaLimpia = nuevaCedula.trim();

        if (empleadosLocal[cedulaLimpia]) {
            alert("Este empleado ya existe en la base de datos: " + empleadosLocal[cedulaLimpia]);
            return;
        }

        const nuevoNombre = prompt("Ingrese el nombre completo del empleado (Cédula: " + cedulaLimpia + "):");
        
        if (!nuevoNombre || nuevoNombre.trim() === "") {
            return; 
        }

        const nombreLimpio = nuevoNombre.trim().toUpperCase();

        // Enviar el nuevo empleado directamente al nodo 'empleados' de Firebase
        db.ref('empleados/' + cedulaLimpia).set(nombreLimpio)
            .then(() => {
                alert("✅ Empleado agregado correctamente y sincronizado en la nube:\n\nCédula: " + cedulaLimpia + "\nNombre: " + nombreLimpio);
            })
            .catch(err => {
                alert("Error al agregar empleado: " + err.message);
            });
    }

    // Autocompletar nombre al escribir cédula
    document.getElementById('cedula').addEventListener('input', function() {
      const val = this.value.trim();
      document.getElementById('nombre').value = empleadosLocal[val] || '';
    });

    // --- 5. LÓGICA DE REGISTRO ---
    
    function actualizarContador() {
        const fechaHoy = new Date().toLocaleDateString();
        const registrosHoy = registrosLocal.filter(r => r.fecha === fechaHoy);
        
        document.getElementById('num-contador').innerText = registrosHoy.length;

        const enPiso = registrosHoy.filter(r => r.horaSalida === 'Pendiente');
        
        let dprisa = 0, ht = 0, seripro = 0, otros = 0;
        
        enPiso.forEach(r => {
            if (r.procedencia === 'Dprisa') dprisa++;
            else if (r.procedencia === 'H&T') ht++;
            else if (r.procedencia === 'Seripro') seripro++;
            else otros++;
        });

        const resumenDiv = document.getElementById('resumen-maquila');
        
        if (registrosHoy.length > 0) {
            resumenDiv.style.display = 'block';
            let texto = `Proveedor: Dprisa: ${dprisa} | H&T: ${ht} | Seripro: ${seripro}`;
            if (otros > 0) texto += ` | Otros: ${otros}`;
            resumenDiv.innerText = texto;
        } else {
            resumenDiv.style.display = 'none';
        }
    }

    function registrar(accion) {
      const cedula = document.getElementById('cedula').value.trim();
      const nombre = document.getElementById('nombre').value.trim();
      const procedenciaSeleccionada = document.getElementById('procedencia').value;
      
      const ahora = new Date();
      const fechaHoy = ahora.toLocaleDateString();
      const horaActualStr = ahora.toLocaleTimeString();

      if (!cedula) {
        alert('Ingrese una cédula'); return;
      }
      if (!nombre) {
        sound.play(); alert('Empleado no encontrado en la base de datos.'); return;
      }

      const registroExistente = registrosLocal.find(r => r.cedula === cedula && r.fecha === fechaHoy);

      if (accion === 'Ingreso') {
          if (!procedenciaSeleccionada) {
              sound.play(); alert('Seleccione procedencia (Maquila).'); return;
          }

          if (registroExistente) {
              sound.play(); alert('Error: Ya tiene INGRESO registrado hoy.'); return;
          }

          const nuevoRegistro = {
              cedula,
              nombre,
              procedencia: procedenciaSeleccionada,
              fecha: fechaHoy,
              horaIngreso: horaActualStr,
              horaSalida: 'Pendiente',
              tiempoLaborado: 'En curso',
              timestampIngreso: ahora.getTime()
          };
          
          refRegistros.push(nuevoRegistro).catch(err => alert("Error de red: " + err.message));

      } else if (accion === 'Salida') {
          if (!registroExistente) {
              sound.play(); alert('Error: No tiene registro de entrada hoy.'); return;
          }

          if (registroExistente.horaSalida !== 'Pendiente') {
              sound.play(); alert('Error: Ya marcó SALIDA hoy.'); return;
          }

          const msIngreso = registroExistente.timestampIngreso;
          const diffMs = ahora.getTime() - msIngreso;
          const diffHrs = Math.floor(diffMs / 3600000);
          const diffMins = Math.floor((diffMs % 3600000) / 60000);
          
          db.ref('registros/' + registroExistente.idFirebase).update({
              horaSalida: horaActualStr,
              tiempoLaborado: `${diffHrs}h ${diffMins}m`
          }).catch(err => alert("Error de red: " + err.message));
      }

      sound.play();
      
      document.getElementById('cedula').value = '';
      document.getElementById('nombre').value = '';
      document.getElementById('procedencia').value = '';
      document.getElementById('cedula').focus();
    }

    function verificarTurnosOlvidados() {
        const ahoraMs = new Date().getTime();
        const limiteMs = 14 * 60 * 60 * 1000;

        registrosLocal.forEach(reg => {
            if (reg.horaSalida === 'Pendiente' && reg.timestampIngreso) {
                if ((ahoraMs - reg.timestampIngreso) > limiteMs) {
                    db.ref('registros/' + reg.idFirebase).update({
                        horaSalida: 'Sin Salida',
                        tiempoLaborado: 'No registrado'
                    }).catch(err => console.error(err));
                }
            }
        });
    }
    setInterval(verificarTurnosOlvidados, 60000);

    function renderizarTabla() {
        const tbody = document.querySelector('#tabla tbody');
        const fechaHoy = new Date().toLocaleDateString();
        
        const registrosReversos = registrosLocal.slice().reverse();
        
        const registrosHoy = registrosReversos.filter(reg => reg.fecha === fechaHoy);
        const registrosPasados = registrosReversos.filter(reg => reg.fecha !== fechaHoy);

        const mapearFila = (reg) => {
            const claseSalida = (reg.horaSalida === 'Pendiente' || reg.horaSalida === 'Sin Salida') ? 'pendiente' : 'completado';
            
            let tiempoVisual = reg.tiempoLaborado;
            if (reg.horaSalida === 'Pendiente' && reg.timestampIngreso) {
                const ahoraMs = new Date().getTime();
                const diffMs = ahoraMs - reg.timestampIngreso;
                const diffHrs = Math.floor(diffMs / 3600000);
                const diffMins = Math.floor((diffMs % 3600000) / 60000);
                tiempoVisual = `⏱️ ${diffHrs}h ${diffMins}m`;
            }

            return `
            <tr>
                <td>${reg.cedula}</td>
                <td>${reg.nombre}</td>
                <td>${reg.procedencia}</td>
                <td>${reg.fecha}</td>
                <td style="color:green; font-weight:bold;">${reg.horaIngreso}</td>
                <td class="${claseSalida}">${reg.horaSalida}</td>
                <td style="font-weight:bold;">${tiempoVisual}</td>
            </tr>
            `;
        };

        let htmlFinal = registrosHoy.map(mapearFila).join('');

        if (registrosPasados.length > 0) {
            htmlFinal += `
            <tr>
                <td colspan="7" style="background-color: #e0e0e0; font-weight: bold; font-size: 14px; padding: 12px; border-top: 2px solid #aaa; border-bottom: 2px solid #aaa; text-transform: uppercase;">
                    ⬇ HISTORIAL DE MARCACIONES PASADAS ⬇
                </td>
            </tr>
            ` + registrosPasados.map(mapearFila).join('');
        }

        tbody.innerHTML = htmlFinal;
    }

    setInterval(renderizarTabla, 60000);

    function descargarExcel(tipo) {
      const fechaHoy = new Date().toLocaleDateString();
      let registrosFiltrados = [];

      if (tipo === 'hoy') {
          registrosFiltrados = registrosLocal.filter(r => r.fecha === fechaHoy);
      } else if (tipo === 'pasadas') {
          registrosFiltrados = registrosLocal.filter(r => r.fecha !== fechaHoy);
      }

      if (registrosFiltrados.length === 0) {
          alert('No hay datos para exportar en esta categoría.');
          return;
      }

      const datosParaExcel = registrosFiltrados.map(({idFirebase, timestampIngreso, ...resto}) => {
          let tiempoLimpio = resto.tiempoLaborado;
          if (resto.horaSalida === 'Pendiente') {
              tiempoLimpio = "En curso";
          }
          return { ...resto, tiempoLaborado: tiempoLimpio };
      });
      
      const ws = XLSX.utils.json_to_sheet(datosParaExcel);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Asistencia");
      
      const nombreArchivo = tipo === 'hoy' ? 'marcaciones_hoy.xlsx' : 'historial_pasadas.xlsx';
      XLSX.writeFile(wb, nombreArchivo);
    }

    function limpiarRegistros() {
        if (confirm('Desea borrar los registros.\n¿Continuar?')) {
            const clave = prompt('Ingrese la clave de seguridad:');
            if (clave === 'Oriflame2026') {
                refRegistros.remove();
            } else {
                alert('Clave incorrecta. Operación cancelada.');
            }
        }
    }

    // --- 6. BLOQUEOS DE SEGURIDAD SOLICITADOS ---
    
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            return false;
        }

        if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) {
            e.preventDefault();
            return false;
        }

        if (e.ctrlKey && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.keyCode === 73)) {
            e.preventDefault();
            return false;
        }

        if (e.ctrlKey && e.shiftKey && (e.key === 'j' || e.key === 'J' || e.keyCode === 74)) {
            e.preventDefault();
            return false;
        }

        if (e.ctrlKey && (e.key === 's' || e.key === 'S' || e.keyCode === 83)) {
            e.preventDefault();
            return false;
        }
    });
  </script>
</body>
</html>
